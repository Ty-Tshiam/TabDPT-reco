name: CI Pipeline

on:
    push:
        branches: ["main"]
    pull_request: 
        branches: ["main"]

jobs: 
    build-and-test:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.12", "3.13", "3.14"]

        steps:
        - name: Checkout code 
          uses: actions/checkout@v4
          with:
            submodules: recursive

        - name: Set up Python ${{ matrix.python-version }}
          uses: actions/setup-python@v5
          with:
            python-version: ${{ matrix.python-version }}
            cache: 'pip'
        
        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install pytest pytest-cov ruff

        - name: Lint with Ruff
          run: |
            ruff check .
            ruff format --check .
        
        - name: Debug tabdpt
          run: |
            ls src/TabDPT-inference/src || echo "submodule missing"
            PYTHONPATH=src/TabDPT-inference/src python -c "import tabdpt; print(tabdpt.__file__)"
            pip list | grep -i tabdpt
                  
        - name: Test with pytest
          run: |
            pytest --cov=. --cov-report=xml --junitxml=junit/test-results-${{ matrix.python-version }}.xml

        - name: Upload test results 
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: pytest-results-${{ matrix.python-version }}
            path: junit/test-results-${{ matrix.python-version }}.xml
